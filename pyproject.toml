[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradetracker"
version = "0.2.0"
description = "A command-line tool for tracking university module grades"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prosper Manjeya" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gradetracker = "gradetracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
